{{ define "title" }}
{{ end }}

{{ define "main" }}
  <main>
    <h1 class="headerTitle">
        Blog
    </h1>
    <div class="blogPost">
      <div class="content card sr-only blogPost">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
      </div>
      {{ range where .Site.RegularPages "Section" "blog" }}
        <div class="content blog subpage" id="{{ .Title | anchorize }}">
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          {{ .Summary }}
          <a class="readMore" href="{{ .RelPermalink }}">read the full post...</a>
        </div>
      {{ end }}
    </div>
  </main>
{{ end }}
